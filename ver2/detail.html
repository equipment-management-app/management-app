<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場詳細</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="print.css" media="print">
</head>

<body>
    <h1 id="site-name-heading"></h1>
    <div id="status-section" style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
        <strong>ステータス: </strong>
        <select id="status-select" class="status-select" onchange="updateStatus(this)">
            <option value="現場前">現場前</option>
            <option value="現場中">現場中</option>
            <option value="完了">完了</option>
            <option value="キャンセル">キャンセル</option>
        </select>
    </div>
    <p id="site-date"></p>
    <div class="section" style="margin-bottom: 3%;">
        <h2>回線図</h2>
        <div id="photo-display-area"
            style="margin-top: 10px; min-height: 150px; border: 2px dashed #ccc; padding: 10px; text-align: center;">
            <span id="photo-placeholder" style="color: #888;">写真がありません</span>
            <img id="site-photo" src="" alt="現場写真" style="max-width: 100%; max-height: 400px; display: none;">
        </div>
        <div class="no-print" style="margin-top: 15px;">
            <input type="file" id="photo-upload-input" accept="image/*" style="display: block; margin-bottom: 10px;">
            <button type="button" onclick="handlePhotoUpload()" class="btn-main">この写真を登録</button>
        </div>
        <div id="upload-result" style="margin-top: 10px;"></div>
    </div>

    <div class="section">
        <h2>使用機材リスト</h2>
        <div id="bulk-return-section"
            style="margin-bottom: 10px; padding: 10px; background-color: #f3f3f3; border: 1px solid #ddd; border-radius: 5px; display: none;">
            <label style="cursor: pointer; font-weight: bold;">
                <input type="checkbox" id="return-all-checkbox" onchange="handleReturnAll(this)">
                すべて返却済にする
            </label>
        </div>
        <table id="site-details-table">
            <thead>
                <tr>
                    <th>機材ID</th>
                    <th>機材名</th>
                    <th>使用数</th>
                    <th>単価</th>
                    <th>合計</th>
                    <th>返却チェック</th>
                </tr>
            </thead>
            <tbody id="site-details-body"></tbody>
        </table>
        <div id="grand-total-section"
            style="text-align: right; margin-top: 15px; font-size: 1.2em; font-weight: bold; padding-right: 10px;">
            総計: <span id="grand-total-value">0</span>
        </div>
        <div id="loading-details" style="display: block;">読み込み中...</div>
    </div>

    <div id="pdf-export-button" style="margin-top: 20px;">
        <button type="button" onclick="window.print()"
            style="padding: 10px 20px; font-size: 1em; cursor: pointer; background-color: gray;">
            PDFとして出力
        </button>
    </div>

    <a href="index.html">現場リストに戻る</a>

    <script src="detail.js"></script>
</body>

</html>
