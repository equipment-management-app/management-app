<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場管理システム</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-header">
        <h1>現場管理システム</h1>
        <a href="EQList.html" class="nav-button">機材管理ページへ</a>
    </div>

    <div class="container">
        <div class="section">
            <h2>📋現場リスト</h2>
            <div class="filter-container">
                <div class="filter-box">
                    <label>
                        <input type="checkbox" id="hide-completed-checkbox" onchange="applyFilterAndRender()">
                        完了・キャンセルの現場を隠す
                    </label>
                </div>
                <div class="filter-box">
                    <strong>タグで絞り込み:</strong>
                    <label><input type="checkbox" id="filter-video" onchange="applyFilterAndRender()"> 映像</label>
                    <label><input type="checkbox" id="filter-audio" onchange="applyFilterAndRender()"> 音響</label>
                </div>
            </div>
            <div class="search-box">
                <input type="search" id="searchInput" placeholder="現場名で検索...">
            </div>
            <p>リストの行をクリックすると詳細ページへ移動します。</p>
            <table id="site-list-table">
                <thead>
                    <tr>
                        <th>現場名</th>
                        <th>日程</th>
                        <th>タグ</th>
                        <th>ステータス</th>
                    </tr>
                </thead>
                <tbody id="site-list-body"></tbody>
            </table>
            <div id="loading-sites" style="display: none;">読み込み中...</div>
            <div id="siteListPaginationControls" class="pagination-controls">
                <div id="siteListInfo" class="pagination-info"></div>
                <div class="buttons">
                    <button id="prevSitePageButton" onclick="prevSitePage()">前へ</button>
                    <button id="nextSitePageButton" onclick="nextSitePage()">次へ</button>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>➕現場登録</h2>
            <form id="registerSiteForm">
                <div>
                    <label for="siteName">現場名:</label>
                    <input type="text" id="siteName" name="siteName" required>
                </div>
                <div>
                    <label for="startDate">現場期間:</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="date" id="startDate" name="startDate" required style="flex: 1;">
                        <span>〜</span>
                        <input type="date" id="endDate" name="endDate" required style="flex: 1;">
                    </div>
                </div>
                <div>
                    <label for="returnDate">機材返却日:</label>
                    <input type="date" id="returnDate" name="returnDate">
                </div>
                <div>
                    <fieldset class="tag-fieldset">
                        <legend>タグ</legend>
                        <label><input type="checkbox" id="tag-video-reg"> 映像</label>
                        <label><input type="checkbox" id="tag-audio-reg"> 音響</label>
                    </fieldset>
                </div>
                <div style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; background-color: #f9f9f9;">
                    <h3 style="margin-top:0;">機材追加</h3>
                    <div style="display: flex; gap: 10px; align-items: flex-end;">
                        <div style="flex: 3;" class="equipment-search-container">
                            <label for="equipmentName">機材名:</label>
                            <input type="text" id="equipmentName" placeholder="機材名を入力..." autocomplete="off">
                            <div id="equipmentSuggestions" class="search-suggestions"></div>
                        </div>
                        <div style="flex: 1;">
                            <label for="equipmentInUse">使用数:</label>
                            <input type="number" id="equipmentInUse" value="1" min="1">
                        </div>
                    </div>
                    <button type="button" class="btn-add" onclick="addEquipmentToSite()"
                        style="margin-top: 10px; width: 100%;">この機材を追加</button>

                    <div id="equipmentList" style="margin-top: 15px;">
                        <strong>追加済み機材:</strong>
                        <div id="equipmentItems"
                            style="min-height: 50px; background-color: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px;">
                            <span style="color: #888;">機材が追加されるとここに表示されます</span>
                        </div>
                        <button type="button" class="btn-clear" onclick="clearEquipmentList()"
                            style="margin-top: 5px; font-size: 0.8em; padding: 5px 10px;">リストをクリア</button>
                    </div>
                </div>
                <button type="button" class="btn-main" onclick="registerSite()">この内容で現場を登録</button>
            </form>
            <div id="registerSiteResult" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
