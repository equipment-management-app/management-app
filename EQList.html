    <meta charset="UTF-8">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="flex justify-between items-center mb-8 pb-4 border-b-2 border-gray-400">
            <h1 class="text-4xl font-bold text-blue-600">機材管理システム</h1>
            <a href="index.html"
                class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150">現場管理ページへ</a>
        </header>

        <div id="equipmentManagement">
            <div class="bg-white p-6 rounded-xl shadow-xl mb-8">
                <h2 class="text-2xl font-semibold text-gray-700 mb-6 border-b pb-3">機材リスト</h2>
                <div id="tagFilterContainer" class="mb-4">
                    <label for="tagFilter" class="block text-sm font-medium text-gray-700 mb-1">タグで絞り込む:</label>
                    <select id="tagFilter" onchange="applyTagFilter()"
                        class="w-full sm:w-auto p-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    </select>
                </div>
                <div id="equipmentListResult"
                    class="result-area mt-4 p-4 bg-gray-50 rounded-lg border border-gray-200 min-h-[100px] overflow-x-auto">
                    ここに機材リストが表示されます。</div>
                <div id="eqListPaginationControls" class="flex justify-between items-center mt-4"
                    style="display: none;">
                    <div id="eqListInfo" class="text-sm text-gray-600"></div>
                    <div class="flex space-x-2">
                        <button id="prevEqPageButton" onclick="prevEqPage()"
                            class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed">前へ</button>
                        <button id="nextEqPageButton" onclick="nextEqPage()"
                            class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg shadow-md transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed">次へ</button>
                    </div>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-xl">
                    <h2 class="text-2xl font-semibold text-gray-700 mb-6 border-b pb-3">➕ 機材登録</h2>
                    <form id="registerEquipmentForm" class="space-y-4">
                        <div>
                            <label for="regEqCategory"
                                class="block text-sm font-medium text-gray-700 mb-1">カテゴリ:</label>
                            <select id="regEqCategory" name="regEqCategory" required
                                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            </select>
                        </div>
                        <div>
                            <label for="regEqName" class="block text-sm font-medium text-gray-700 mb-1">機材名:</label>
                            <input type="text" id="regEqName" name="regEqName" required
                                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="regEqTotal" class="block text-sm font-medium text-gray-700 mb-1">総数:</label>
                            <input type="number" id="regEqTotal" name="regEqTotal" required
                                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="regEqUnitPrice" class="block text-sm font-medium text-gray-700 mb-1">単価
                                (¥):</label>
                            <div class="flex items-center space-x-4">
                                <input type="number" id="regEqUnitPrice" name="regEqUnitPrice" required
                                    class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                <div class="flex items-center">
                                    <input id="regEqManualPrice" type="checkbox"
                                        class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                                    <label for="regEqManualPrice" class="ml-2 block text-sm text-gray-900">手動入力</label>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label for="regEqTag" class="block text-sm font-medium text-gray-700 mb-1">タグ:</label>
                            <select id="regEqTag" name="regEqTag" required
                                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                <option value="">選択してください</option>
                                <option value="映像">映像</option>
                                <option value="音響">音響</option>
                            </select>
                        </div>
                        <button type="button" onclick="registerEquipment();"
                            class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-150 inline-flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path
                                    d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
                                <path fill-rule="evenodd"
                                    d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"
                                    clip-rule="evenodd" />
                            </svg>
                            機材登録
                        </button>
                    </form>
                    <div id="registerEquipmentResult"
                        class="result-area mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200 min-h-[100px] overflow-x-auto">
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-xl">
                    <h2 class="text-2xl font-semibold text-gray-700 mb-6 border-b pb-3">✏️ 機材情報変更</h2>
                    <form id="changeEquipmentForm" class="space-y-4">
                        <div>
                            <label for="changeEqCategory"
                                class="block text-sm font-medium text-gray-700 mb-1">新しいカテゴリ:</label>
                            <select id="changeEqCategory" name="changeEqCategory" required
                                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            </select>
                        </div>
                        <div>
                            <label for="changeEqName" class="block text-sm font-medium text-gray-700 mb-1">機材名
                                (変更対象):</label>
                            <input type="text" id="changeEqName" name="changeEqName" list="equipmentNameList" required
                                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500"
                                placeholder="文字を入力して検索・選択...">
                            <datalist id="equipmentNameList">
                            </datalist>
                        </div>
                        <div>
                            <label for="changeEqQuantity"
                                class="block text-sm font-medium text-gray-700 mb-1">新しい総数:</label>
                            <input type="number" id="changeEqQuantity" name="changeEqQuantity" required
                                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="changeEqUnitPrice" class="block text-sm font-medium text-gray-700 mb-1">新しい単価
                                (¥):</label>
                            <div class="flex items-center space-x-4">
                                <input type="number" id="changeEqUnitPrice" name="changeEqUnitPrice" required
                                    class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                <div class="flex items-center">
                                    <input id="changeEqManualPrice" type="checkbox"
                                        class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                                    <label for="changeEqManualPrice"
                                        class="ml-2 block text-sm text-gray-900">手動入力</label>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label for="changeEqTag" class="block text-sm font-medium text-gray-700 mb-1">新しいタグ:</label>
                            <select id="changeEqTag" name="changeEqTag" required
                                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                                <option value="">選択してください</option>
                                <option value="映像">映像</option>
                                <option value="音響">音響</option>
                            </select>
                        </div>
                        <button type="button" onclick="changeEquipmentInfo();"
                            class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-150 inline-flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path
                                    d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                            情報変更
                        </button>
                    </form>
                    <div id="changeEquipmentResult"
                        class="result-area mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200 min-h-[100px] overflow-x-auto">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="EQList.js"></script>
</body>

</html>
