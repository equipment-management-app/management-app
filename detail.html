<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場詳細</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="print.css" media="print">
</head>

<body>
    <h1 id="site-name-heading"></h1>
    <div id="status-section" style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
        <strong>ステータス: </strong>
        <select id="status-select" class="status-select" onchange="updateStatus(this)">
            <option value="現場前">現場前</option>
            <option value="現場中">現場中</option>
            <option value="完了">完了</option>
            <option value="キャンセル">キャンセル</option>
        </select>
    </div>
    <div id="date-badge-container">
        <p id="site-date" class="date-info-badge"></p>
        <p id="return-date-display" class="date-info-badge" style="display: none;"></p>
    </div>
    <div class="section no-print" style="margin-bottom: 3%;">
        <h2>回線図</h2>
        <div id="photo-display-area"
            style="margin-top: 10px; min-height: 150px; border: 2px dashed #ccc; padding: 10px; text-align: center;">
            <span id="photo-placeholder" style="color: #888;">写真がありません</span>
            <img id="site-photo" src="" alt="現場写真" style="max-width: 100%; max-height: 400px; display: none;">
        </div>
        <div class="no-print" style="margin-top: 15px;">
            <input type="file" id="photo-upload-input" accept="image/*" style="display: block; margin-bottom: 10px;">
            <button type="button" onclick="handlePhotoUpload()" class="btn-main">この写真を登録</button>
        </div>
        <div id="upload-result" style="margin-top: 10px;"></div>
    </div>

    <div class="section">
        <h2>使用機材リスト</h2>
        <div id="bulk-return-section"
            style="margin-bottom: 10px; padding: 10px; background-color: #f3f3f3; border: 1px solid #ddd; border-radius: 5px; display: none;">
            <label style="cursor: pointer; font-weight: bold;">
                <input type="checkbox" id="return-all-checkbox" onchange="handleReturnAll(this)">
                すべて返却済にする
            </label>
        </div>
        <table id="site-details-table">
            <thead>
                <tr>
                    <th>機材ID</th>
                    <th>機材名</th>
                    <th>使用数</th>
                    <th>単価</th>
                    <th>合計</th>
                    <th>返却チェック</th>
                </tr>
            </thead>
            <tbody id="site-details-body"></tbody>
        </table>
        <div id="grand-total-section"
            style="text-align: right; margin-top: 15px; font-size: 1.2em; font-weight: bold; padding-right: 10px;">
            総計: <span id="grand-total-value">0</span>
        </div>
        <div id="loading-details" style="display: block;">読み込み中...</div>
    </div>
    <div class="page-actions-container no-print">

    <div class="actions-left">
        <button type="button" onclick="window.print()" class="btn-secondary">
            PDFとして出力
        </button>
        <div id="edit-button-container">
            <button type="button" onclick="openEditModal()" class="btn-edit">
                現場情報を編集する
            </button>
        </div>
        <div id="equipment-edit-controls">
            <button type="button" id="enter-edit-mode-btn" onclick="toggleEditMode(true)" class="btn-edit">
                機材リストを編集
            </button>
            <div id="editing-buttons" style="display: none;">
                <button type="button" class="btn-add" onclick="openAddEquipmentModal()">機材を追加</button>
                <button type="button" class="btn-main" onclick="saveEquipmentChanges()">変更を保存</button>
                <button type="button" class="btn-cancel" onclick="toggleEditMode(false)">キャンセル</button>
            </div>
        </div>
    </div>

    <div class="actions-right">
        <a href="index.html" class="nav-button-secondary">現場リストに戻る</a>
    </div>

</div>

    <div id="editSiteModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 class="modal-title">現場情報の編集</h3>
            <p class="modal-notice">※この編集はステータスが「現場前」の場合のみ可能です。</p>
            <form id="editSiteForm">
                <div class="form-group">
                    <label for="editSiteName">現場名:</label>
                    <input type="text" id="editSiteName" required>
                </div>
                <div class="form-group">
                    <label for="editTag">タグ:</label>
                    <select id="editTag" required>
                        <option value="">選択してください</option>
                        <option value="映像">映像</option>
                        <option value="音響">音響</option>
                        </select>
                </div>
                <div class="form-group">
                    <label for="editStartDate">開始日:</label>
                    <input type="date" id="editStartDate" required>
                </div>
                <div class="form-group">
                    <label for="editEndDate">終了日:</label>
                    <input type="date" id="editEndDate" required>
                </div>
                <div class="form-group">
                    <label for="editReturnDate">返却日:</label>
                    <input type="date" id="editReturnDate">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-main" onclick="saveSiteInfo()">変更を保存</button>
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">キャンセル</button>
                </div>
            </form>
        </div>
    </div>
    

    <div id="addEquipmentModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 class="modal-title">機材の追加</h3>
            <form id="addEquipmentForm">
                <div class="form-group equipment-search-container">
                    <label for="addEqName">機材を選択:</label>
                    <input type="text" id="addEqName" placeholder="機材名を入力..." autocomplete="off">
                    <div id="addEquipmentSuggestions" class="search-suggestions"></div>
                </div>
                <div class="form-group">
                    <label for="addEqQuantity">使用数:</label>
                    <input type="number" id="addEqQuantity" value="1" min="1">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-main" onclick="addEquipmentToTable()">リストに追加</button>
                    <button type="button" class="btn-cancel" onclick="closeAddEquipmentModal()">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <script src="detail.js"></script>
</body>

</html>
